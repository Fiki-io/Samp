name: Build Pawn Rootfs

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static

      - name: Build minimal rootfs (ARM64)
        run: |
          sudo debootstrap \
            --arch=arm64 \
            --variant=minbase \
            --include=libstdc++6,libc6 \
            bookworm \
            ./rootfs \
            http://deb.debian.org/debian

      - name: Copy pawncc ARM64 binary
        run: |
          # Taruh binary pawncc ARM64 yang sudah dicompile
          sudo cp pawncc ./rootfs/usr/bin/
          sudo cp -r include/ ./rootfs/include/

      - name: Strip rootfs
        run: |
          # Hapus yang tidak perlu
          sudo rm -rf ./rootfs/usr/share/doc
          sudo rm -rf ./rootfs/usr/share/man
          sudo rm -rf ./rootfs/var/cache/apt

      - name: Pack rootfs
        run: |
          cd rootfs
          sudo tar czf ../rootfs-pawn.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-pawn
          path: rootfs-pawn.tar.gz

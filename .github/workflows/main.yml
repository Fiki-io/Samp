name: Build PRoot Static ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-proot:
    name: Build PRoot dari Source (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe" \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            git \
            pkg-config \
            libtalloc-dev:arm64 \
            libtalloc-dev

      - name: Clone PRoot
        run: git clone --depth=1 https://github.com/proot-me/proot.git

      - name: Build PRoot ARM64
        run: |
          cd proot/src

          # Build loader.elf dengan host gcc (bukan cross compiler)
          # karena loader.elf adalah helper kecil yang di-embed
          make CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CFLAGS="-O2 -Wno-deprecated -Wno-unused-result" \
            LDFLAGS="-static" \
            HAS_LOADER_32BIT=0 \
            LOADER_BUILD_ENV="aarch64-linux-gnu-" \
            proot

          aarch64-linux-gnu-strip proot
          file proot
          ls -lh proot

      - name: Upload PRoot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: proot/src/proot

name: Build Custom SA-MP Rootfs (Ultra-Trimmed 35MB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-rootfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. INSTALL BUILD DEPENDENCIES
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-arm-linux-gnueabihf binutils-aarch64-linux-gnu \
            meson ninja-build git tar xz-utils wget curl python3 pkg-config unzip

      # 2. SETUP MINIMAL ROOTFS
      - name: Setup Minimal Ubuntu Base ARM64
        run: |
          mkdir -p rootfs
          wget -q https://cdimage.ubuntu.com/ubuntu-base/releases/22.04/release/ubuntu-base-22.04-base-arm64.tar.gz -O ubuntu-base.tar.gz
          tar -xf ubuntu-base.tar.gz -C rootfs
          rm ubuntu-base.tar.gz

      # 3. BUILD BOX86 FROM SOURCE
      - name: Build Box86
        run: |
          git clone --depth 1 https://github.com/ptitSeb/box86.git
          cd box86 && mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=armv7l \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ \
            -DARM_DYNAREC=ON \
            -DVULKAN=ON
          make -j$(nproc)
          mkdir -p ../../rootfs/usr/local/bin/
          cp box86 ../../rootfs/usr/local/bin/
          cd ../.. && rm -rf box86

      # 4. SETUP WINE 32-BIT & DXVK
      - name: Setup Wine 32-bit & DXVK
        run: |
          mkdir -p rootfs/opt/wine
          mkdir -p rootfs/opt/dxvk

          WINE_URL=$(curl -s https://api.github.com/repos/Kron4ek/Wine-Builds/releases | grep "browser_download_url.*staging-x86.tar.xz" | cut -d '"' -f 4 | head -n 1)
          if [ -z "$WINE_URL" ]; then
            WINE_URL="https://github.com/Kron4ek/Wine-Builds/releases/download/9.16/wine-9.16-staging-x86.tar.xz"
          fi
          wget -q "$WINE_URL" -O wine-x86.tar.xz
          tar -xf wine-x86.tar.xz -C rootfs/opt/wine --strip-components=1
          rm wine-x86.tar.xz

          wget -q https://github.com/doitsujin/dxvk/releases/download/v1.10.3/dxvk-1.10.3.tar.gz
          tar -xf dxvk-1.10.3.tar.gz
          cp dxvk-1.10.3/x32/d3d9.dll rootfs/opt/dxvk/
          rm -rf dxvk-1.10.3*

      # 5. SETUP DRIVER TURNIP
      - name: Download Drivers
        run: |
          mkdir -p rootfs/opt/drivers/adreno
          TURNIP_URL=$(curl -s https://api.github.com/repos/The412Banner/Banners-Turnip/releases/latest | grep "browser_download_url.*zip" | cut -d '"' -f 4 | head -n 1)
          if [ -n "$TURNIP_URL" ]; then
            wget -q "$TURNIP_URL" -O turnip.zip
            unzip -q turnip.zip -d rootfs/opt/drivers/adreno/ || true
            rm -f turnip.zip
          fi

      # 6. INJECT FONTS WAJIB SA-MP
      - name: Install Fonts
        run: |
          mkdir -p rootfs/usr/share/fonts/truetype/
          wget -q -O rootfs/usr/share/fonts/truetype/tahoma.ttf https://github.com/mrbadger/TTF-Fonts/raw/master/Tahoma.ttf || true
          wget -q -O rootfs/usr/share/fonts/truetype/arial.ttf https://github.com/mrbadger/TTF-Fonts/raw/master/Arial.ttf || true

      # -------------------------------------------------------------
      # 7. ULTRA-TRIMMING STEP (PANGKAS FITUR SAMPAH KHUSUS SA-MP)
      # -------------------------------------------------------------
      - name: Ultra-Trim Unnecessary Features
        run: |
          # A. Hapus Wine Mono & Gecko (.NET & IE Engine) -> Penghemat Terbesar!
          rm -rf rootfs/opt/wine/share/wine/gecko
          rm -rf rootfs/opt/wine/share/wine/mono

          # B. Hapus EXE Windows Bawaan Wine yang Tidak Dipakai Game
          cd rootfs/opt/wine/bin/ || true
          rm -f control notepad progman regedit regsvr32 msiexec winefile winemine taskmgr winedbg winedevice || true
          cd -

          # C. Hapus DLL DirectX 10, 11, 12, dan Driver Printer/Scanner
          find rootfs/opt/wine/ -name "d3d10*.dll" -delete || true
          find rootfs/opt/wine/ -name "d3d11*.dll" -delete || true
          find rootfs/opt/wine/ -name "d3d12*.dll" -delete || true
          find rootfs/opt/wine/ -name "dxgi.dll" -delete || true
          find rootfs/opt/wine/ -name "winspool.drv" -delete || true
          find rootfs/opt/wine/ -name "spoolss.dll" -delete || true
          find rootfs/opt/wine/ -name "scarddlg.dll" -delete || true

          # D. Hapus File Bahasa, Headers, Cache, & Docs
          rm -rf rootfs/usr/share/locale/*
          rm -rf rootfs/usr/share/i18n/*
          rm -rf rootfs/usr/include/*
          rm -rf rootfs/usr/share/doc/*
          rm -rf rootfs/usr/share/man/*
          rm -rf rootfs/var/cache/apt/*
          rm -rf rootfs/var/lib/apt/lists/*

          # E. Aggressive Stripping (Hapus Debug Symbols di Seluruh .so & .dll)
          find rootfs/ -type f \( -name "*.so*" -o -name "*.dll" \) -exec arm-linux-gnueabihf-strip --strip-unneeded {} + 2>/dev/null || true
          find rootfs/ -type f \( -name "*.so*" -o -name "*.dll" \) -exec aarch64-linux-gnu-strip --strip-unneeded {} + 2>/dev/null || true

      # 8. KOMPRESI & UPLOAD
      - name: Compress Rootfs
        run: |
          tar -cJf rootfs-samp-full.tar.xz -C rootfs .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-samp-full
          path: rootfs-samp-full.tar.xz

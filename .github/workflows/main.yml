name: Build Minimal RootFS for PAWN Compiler

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-proot:
    name: Build PRoot Static (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            make \
            git \
            pkg-config \
            libarchive-dev \
            libglib2.0-dev

      - name: Clone PRoot
        run: git clone --depth=1 https://github.com/proot-me/proot.git

      - name: Build PRoot static ARM64
        run: |
          cd proot/src
          make \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-static -O2" \
            LDFLAGS="-static" \
            loader.elf loader-m32.elf proot
          aarch64-linux-gnu-strip proot

      - name: Upload PRoot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: proot/src/proot

  build-box64:
    name: Build Box64 Static (ARM64)
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            git

      - name: Clone Box64
        run: git clone --depth=1 https://github.com/ptitSeb/box64.git

      - name: Build Box64 for ARM64
        run: |
          cd box64
          mkdir build && cd build
          cmake .. \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DARM_DYNAREC=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
          make -j$(nproc)
          aarch64-linux-gnu-strip box64

      - name: Upload Box64
        uses: actions/upload-artifact@v4
        with:
          name: box64
          path: box64/build/box64

  build-rootfs:
    name: Build Minimal Debian RootFS
    runs-on: ubuntu-22.04
    steps:
      - name: Install debootstrap & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            qemu-user-static \
            xz-utils \
            binutils

      - name: Bootstrap minimal Debian x86_64
        run: |
          sudo debootstrap \
            --arch=amd64 \
            --variant=minbase \
            --include=libstdc++6,libc6,zlib1g \
            bookworm \
            ./rootfs \
            http://deb.debian.org/debian

      - name: Download pawncc from Open.MP
        run: |
          wget -q https://github.com/openmultiplayer/open.mp/releases/latest/download/open.mp-linux-x86_64.tar.gz
          tar -xzf open.mp-linux-x86_64.tar.gz
          # Extract hanya pawncc binary
          find . -name "pawncc" -type f | head -1 | xargs -I{} cp {} ./rootfs/usr/local/bin/pawncc
          chmod +x ./rootfs/usr/local/bin/pawncc

      - name: Strip & Pangkas RootFS
        run: |
          sudo chroot ./rootfs /bin/sh -c "
            # Hapus apt cache
            apt-get clean
            rm -rf /var/cache/apt/*
            rm -rf /var/lib/apt/lists/*

            # Hapus docs
            rm -rf /usr/share/doc
            rm -rf /usr/share/man
            rm -rf /usr/share/info
            rm -rf /usr/share/locale
            rm -rf /usr/share/i18n

            # Hapus dev files tidak perlu
            rm -rf /usr/include

            # Hapus binary tidak perlu
            rm -rf /bin/mount /bin/umount
            rm -rf /sbin/fdisk /sbin/mkfs* /sbin/fsck*
            rm -rf /usr/bin/perl /usr/bin/python*
            rm -rf /usr/lib/python*

            # Strip semua binary & libs
            find /usr/bin /usr/local/bin /lib /usr/lib -type f \
              \( -name '*.so*' -o -perm /111 \) \
              ! -name '*.py' \
              -exec strip --strip-unneeded {} + 2>/dev/null || true
          "

          # Hapus dari luar
          sudo rm -rf ./rootfs/tmp/*
          sudo rm -rf ./rootfs/var/log/*
          sudo rm -rf ./rootfs/var/tmp/*
          sudo rm -rf ./rootfs/proc
          sudo rm -rf ./rootfs/sys
          sudo rm -rf ./rootfs/dev
          sudo rm -rf ./rootfs/run
          sudo mkdir -p ./rootfs/proc ./rootfs/sys ./rootfs/dev ./rootfs/tmp

      - name: Pack RootFS
        run: |
          sudo tar \
            --numeric-owner \
            -cJf rootfs-minimal.tar.xz \
            -C ./rootfs .
          
          # Tampilkan ukuran akhir
          echo "=== Ukuran RootFS ==="
          du -sh ./rootfs
          ls -lh rootfs-minimal.tar.xz

      - name: Upload RootFS
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-minimal
          path: rootfs-minimal.tar.xz

  package-assets:
    name: Package All Assets
    runs-on: ubuntu-22.04
    needs: [build-proot, build-box64, build-rootfs]
    steps:
      - name: Download semua artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Susun struktur assets
        run: |
          mkdir -p assets
          cp artifacts/proot-arm64/proot      assets/proot
          cp artifacts/box64/box64             assets/box64
          cp artifacts/rootfs-minimal/rootfs-minimal.tar.xz assets/rootfs.tar.xz

          echo "=== Assets Final ==="
          ls -lh assets/

      - name: Upload Final Assets
        uses: actions/upload-artifact@v4
        with:
          name: android-assets
          path: assets/
          retention-days: 30

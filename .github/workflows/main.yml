name: Build PRoot ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch-proot:
    name: Fetch PRoot Binary ARM64
    runs-on: ubuntu-22.04
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget binutils file zstd

      - name: Download PRoot ARM64
        run: |
          wget -q "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages" -O Packages

          PROOT_PKG=$(grep -A5 "^Package: proot$" Packages | grep "Filename:" | head -1 | awk '{print $2}')
          echo "Package path: $PROOT_PKG"

          wget -q "https://packages.termux.dev/$PROOT_PKG" -O proot.deb
          ls -lh proot.deb

          ar x proot.deb
          ls -la

          if [ -f data.tar.xz ]; then
            tar -xJf data.tar.xz
          elif [ -f data.tar.gz ]; then
            tar -xzf data.tar.gz
          elif [ -f data.tar.zst ]; then
            tar -I zstd -xf data.tar.zst
          fi

          find . -path "*/bin/proot" -type f | head -1 | xargs -I{} cp {} ./proot

          echo "=== Verifikasi ==="
          file ./proot
          ls -lh ./proot

      - name: Upload PRoot
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: proot

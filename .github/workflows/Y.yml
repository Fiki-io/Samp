name: Download Direct MediaFire to GitHub Artifact

on:
  workflow_dispatch: # Memicu workflow secara manual melalui tab Actions

jobs:
  transfer-file:
    runs-on: ubuntu-latest

    steps:
      - name: Unduh File via Direct Link
        run: |
          # Menyimpan direct link ke dalam variabel
          DIRECT_LINK="https://www.mediafire.com/file/28k7r6dh2073okk/CARA+MAIN+GTA+SAMP+NEXOTIS.rar/file?dkey=l8lojbhwvhd&r=831"
          
          echo "Memulai pengunduhan langsung..."
          
          # Mengunduh langsung menggunakan curl dengan header User-Agent agar aman
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "$DIRECT_LINK" -o "gta_samp_nexotis.rar"
          
          echo "Unduhan selesai!"
          echo "Memeriksa ukuran file yang terunduh:"
          ls -lh "gta_samp_nexotis.rar"

      - name: Unggah ke GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gta-samp-nexotis-archive
          path: gta_samp_nexotis.rar
          retention-days: 5
